  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const world = document.getElementById("hf2-world");
      const screenshot = document.getElementById("hf2-screenshot");
      const intro = document.getElementById("hf2-intro");
      const introWords = Array.from(document.querySelectorAll(".hf2-intro-word"));
      const crop = document.getElementById("hf2-crop");
      const aiCrop = document.getElementById("hf2-ai-crop");
      const signedLabel = document.getElementById("hf2-signed-label");
      const surfaceIndex = document.getElementById("hf2-surface-index");
      const statePanel = document.getElementById("hf2-state-panel");
      const stateText = document.getElementById("hf2-state-text");
      const cursor = document.getElementById("hf2-cursor");
      const lockup = document.getElementById("hf2-lockup");

      const cam = { scale: 0.76, x: 330, y: 52 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();

      gsap.set([crop, aiCrop, signedLabel, statePanel, lockup], { opacity: 0 });
      gsap.set(surfaceIndex, { opacity: 0 });

      tl.fromTo(
        world,
        { opacity: 0 },
        { opacity: 1, duration: 1.15, ease: "power3.out", immediateRender: true },
        0.12,
      );

      const WORD_BASE = 0.34;
      const SEC_PER_CHAR = 0.028;
      let wordStart = 0.18;
      introWords.forEach((word) => {
        const wordDuration = WORD_BASE + word.textContent.length * SEC_PER_CHAR;
        tl.fromTo(
          word,
          { x: 62, opacity: 0 },
          { x: 0, opacity: 1, duration: wordDuration, ease: "power4.out", immediateRender: true },
          wordStart,
        );
        wordStart += Math.max(0.42, wordDuration * 0.72);
      });

      tl.fromTo(
        ".hf2-intro-rule",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.55, ease: "power3.out", immediateRender: true },
        2.25,
      );
      tl.fromTo(
        ".hf2-intro-note",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.72, ease: "power3.out", immediateRender: true },
        2.52,
      );

      tl.to(
        cam,
        {
          scale: 1.05,
          x: -94,
          y: -14,
          duration: 2.1,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        5.05,
      );
      tl.to(intro, { x: -230, opacity: 0, duration: 0.32, ease: "power4.in" }, 4.78);
      tl.fromTo(
        crop,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: true },
        5.1,
      );
      tl.fromTo(
        signedLabel,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.48, ease: "power4.out", immediateRender: true },
        7.42,
      );
      tl.fromTo(
        surfaceIndex,
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", immediateRender: true },
        9.25,
      );

      tl.to(
        cam,
        {
          scale: 1.09,
          x: -128,
          y: -238,
          duration: 1.25,
          ease: "power3.inOut",
          onUpdate: applyCamera,
        },
        12,
      );
      tl.to(screenshot, { y: -34, duration: 1.25, ease: "power3.inOut" }, 12);
      tl.set([crop, signedLabel], { opacity: 0 }, 12.22);
      tl.fromTo(
        aiCrop,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: true },
        12.23,
      );
      tl.fromTo(
        statePanel,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: true },
        12.64,
      );

      const STATES = [
        { t: 0, text: "CHAIN FACTS: DETERMINISTIC" },
        { t: 2.45, text: "CHAIN FACTS: DETERMINISTIC\nPROSE: AI-AUTHORED" },
        { t: 5.4, text: "CHAIN FACTS: DETERMINISTIC\nPROSE: AI-AUTHORED\nPAYMENT AUTHORITY: NONE" },
      ];
      const stateAt = (time) => {
        for (let i = STATES.length - 1; i >= 0; i -= 1) {
          if (time >= STATES[i].t) return STATES[i].text;
        }
        return "";
      };
      const stateDriver = { t: 0 };
      let lastState = "";
      tl.to(
        stateDriver,
        {
          t: 8,
          duration: 8,
          ease: "none",
          onUpdate: () => {
            const nextState = stateAt(stateDriver.t);
            if (nextState !== lastState) {
              stateText.textContent = nextState;
              lastState = nextState;
            }
          },
        },
        12,
      );

      const blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 11,
          duration: 8,
          ease: "none",
          onUpdate: () => {
            cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        12,
      );

      tl.set([statePanel, aiCrop], { opacity: 0 }, 20);
      tl.fromTo(
        lockup,
        { opacity: 0, scale: 1.25, filter: "blur(10px)" },
        {
          opacity: 1,
          scale: 1,
          filter: "blur(0px)",
          duration: 0.5,
          ease: "expo.out",
          immediateRender: true,
        },
        20.03,
      );

      const hold = { p: 0 };
      tl.to(hold, { p: 1, duration: 3.47, ease: "none" }, 20.53);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-signed-request"] = tl;
    })();
  </script>
