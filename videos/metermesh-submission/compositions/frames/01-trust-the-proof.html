  </style>

  <div
    id="root"
    data-composition-id="01-trust-the-proof"
    data-start="0"
    data-duration="16.4"
    data-width="1920"
    data-height="1080"
  >
    <div
      id="hf1-ground"
      class="clip trust-proof-ground"
      data-start="0"
      data-duration="16.4"
      data-track-index="0"
    ></div>

    <div
      id="hf1-content"
      class="clip trust-proof-content"
      data-start="0"
      data-duration="16.4"
      data-track-index="1"
    >
      <div class="trust-proof-stage">
        <div class="trust-proof-register" id="hf1-register">
          <div class="trust-proof-copy-zone">
            <div
              class="trust-proof-message"
              id="hf1-message"
              data-layout-allow-overlap
              aria-label="AI work arrives as a message."
            >
              <span class="trust-proof-message-word">AI</span>
              <span class="trust-proof-message-word">work</span>
              <span class="trust-proof-message-word">arrives</span>
              <span class="trust-proof-message-word">as</span>
              <span class="trust-proof-message-word">a</span>
              <span class="trust-proof-message-word">message.</span>
            </div>

        <div
          class="trust-proof-product-surface"
          id="hf1-product-surface"
          data-layout-allow-overflow
        >
          <div class="trust-proof-product-world" id="hf1-product-world">
            <div class="trust-proof-page-frame">
              <div class="trust-proof-page-media">
                <img
                  class="trust-proof-page-image"
                  id="hf1-page-image"
                  src="assets/image_001.png"
                  alt=""
                />

              </div>
            </div>

              USER VALUE · INNOVATION · PRODUCT CLARITY.
            </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "01-trust-the-proof";
      const root = document.querySelector('[data-composition-id="01-trust-the-proof"]');
      const register = document.getElementById("hf1-register");
      const message = document.getElementById("hf1-message");
      const evidence = document.getElementById("hf1-evidence");
      const payoff = document.getElementById("hf1-payoff");
      const rule = document.getElementById("hf1-rule");
      const productSurface = document.getElementById("hf1-product-surface");
      const productWorld = document.getElementById("hf1-product-world");
      const cropTarget = document.getElementById("hf1-crop-target");
      const valueLabel = document.getElementById("hf1-value-label");
      const words = Array.from(root.querySelectorAll(".trust-proof-message-word"));

      const tl = gsap.timeline({ paused: true });

      const wordContent = words.map((element) => element.textContent.trim());
      const BASE_WORD_WINDOW = 0.18;
      const SECONDS_PER_CHARACTER = 0.028;
      let wordCursor = 0.18;
      const WORD_TIMELINE = wordContent.map((text, index) => {
        const duration = BASE_WORD_WINDOW + text.length * SECONDS_PER_CHARACTER;
        const start = wordCursor;
        wordCursor += duration;
        return { index, start, end: wordCursor };
      });

      WORD_TIMELINE.forEach((entry) => {
        tl.fromTo(
          words[entry.index],
          { y: 0.65 * 86, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.42, ease: "power3.out", immediateRender: false },
          entry.start,
        );
      });

      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 1.35, ease: "power3.out", immediateRender: false },
        0.24,
      );

      const TEXT_STATES = [
        { t: 0, key: "message" },
        { t: 4, key: "evidence" },
      ];

      function textStateAt(time) {
        for (let index = TEXT_STATES.length - 1; index >= 0; index -= 1) {
          if (time >= TEXT_STATES[index].t) return TEXT_STATES[index].key;
        }
        return TEXT_STATES[0].key;
      }

      let lastTextState = "";
      const textDriver = { t: 0 };
      message.style.opacity = "1";
      evidence.style.opacity = "0";

      tl.to(
        textDriver,
        {
          t: 8,
          duration: 8,
          ease: "none",
          onUpdate: () => {
            const nextState = textStateAt(textDriver.t);
            if (nextState === lastTextState) return;
            message.style.opacity = nextState === "message" ? "1" : "0";
            evidence.style.opacity = nextState === "evidence" ? "1" : "0";
            lastTextState = nextState;
          },
        },
        0,
      );

      tl.fromTo(
        payoff,
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.62, ease: "power4.out", immediateRender: false },
        5.25,
      );

      tl.to(
        register,
        { scale: 1.1, filter: "blur(18px)", duration: 0.25, ease: "power3.in" },
        7.75,
      );
      tl.to(register, { opacity: 0, duration: 0.25, ease: "none" }, 7.75);

      const worldRect = productWorld.getBoundingClientRect();
      const targetRect = cropTarget.getBoundingClientRect();
      const measuredOffsetX = targetRect.width
        ? targetRect.left + targetRect.width / 2 - (worldRect.left + worldRect.width / 2)
        : -62;
      const measuredOffsetY = targetRect.height
        ? targetRect.top + targetRect.height / 2 - (worldRect.top + worldRect.height / 2)
        : -293;
      const OPENING_SCALE = 5.6;
      const cam = {
        scale: OPENING_SCALE,
        x: -measuredOffsetX * OPENING_SCALE,
        y: -measuredOffsetY * OPENING_SCALE,
      };

      function applyCamera() {
        productWorld.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      applyCamera();
      tl.set(productSurface, { opacity: 0 }, 0);
      tl.set(valueLabel, { opacity: 0 }, 0);
      tl.fromTo(
        productSurface,
        { opacity: 0.15, filter: "blur(18px)" },
        {
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.34,
          ease: "expo.out",
          immediateRender: false,
        },
        8,
      );
      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 4.7,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        8.3,
      );
      tl.set(valueLabel, { opacity: 1 }, 14);

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;
    })();
  </script>
