  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "04-honest-failure";
      const proofLayout = document.getElementById("hf4-proof-layout");
      const truthAccent = document.getElementById("hf4-truth-accent");
      const routeText = document.getElementById("hf4-route-text");
      const routeCursor = document.getElementById("hf4-route-cursor");
      const gate = document.getElementById("hf4-gate");

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        proofLayout,
        { scale: 0.74, opacity: 0 },
        {
          scale: 1,
          opacity: 1,
          duration: 1.1,
          ease: "back.out(1.4)",
          immediateRender: false,
        },
        0.08,
      );

      tl.set(truthAccent, { opacity: 0 }, 0);
      tl.set(truthAccent, { opacity: 1 }, 11.4);

      const ROUTE_STATES = [
        { t: 0, text: "" },
        { t: 0.18, text: "/.well" },
        { t: 0.48, text: "/.well-known/" },
        { t: 0.82, text: "/.well-known/metermesh.json" },
        { t: 1.42, text: "/.well-known/metermesh.json\n/open" },
        { t: 1.76, text: "/.well-known/metermesh.json\n/openapi.json" },
        { t: 2.48, text: "/.well-known/metermesh.json\n/openapi.json\n/ll" },
        { t: 2.82, text: "/.well-known/metermesh.json\n/openapi.json\n/llms.txt" },
      ];

      function routeStateAt(time) {
        for (let index = ROUTE_STATES.length - 1; index >= 0; index -= 1) {
          if (time >= ROUTE_STATES[index].t) return ROUTE_STATES[index].text;
        }
        return "";
      }

      const routeDriver = { t: 0 };
      tl.to(
        routeDriver,
        {
          t: 5,
          duration: 5,
          ease: "none",
          onUpdate: () => {
            routeText.textContent = routeStateAt(routeDriver.t);
            routeCursor.style.opacity = Math.sin(routeDriver.t * Math.PI * 2.5) > 0 ? "1" : "0";
          },
        },
        17,
      );

      tl.fromTo(
        gate,
        { scale: 0.72, opacity: 0 },
        {
          scale: 1,
          opacity: 1,
          duration: 0.72,
          ease: "back.out(1.4)",
          immediateRender: false,
        },
        22.14,
      );

      const hold = { t: 0 };
      tl.to(hold, { t: 1, duration: 3.14, ease: "none" }, 22.86);

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;
    })();
  </script>
