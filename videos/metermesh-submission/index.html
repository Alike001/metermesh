<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-trust-the-proof"
        class="scene"
        data-composition-id="01-trust-the-proof"
        data-composition-src="compositions/frames/01-trust-the-proof.html"
        data-start="0"
        data-duration="16.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-signed-request"
        class="scene"
        data-composition-id="02-signed-request"
        data-composition-src="compositions/frames/02-signed-request.html"
        data-start="16"
        data-duration="24.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-verification-anchor"
        class="scene"
        data-composition-id="03-verification-anchor"
        data-composition-src="compositions/frames/03-verification-anchor.html"
        data-start="40"
        data-duration="24.4"
        data-track-index="0"
      ></div>

      <div
        id="el-04-honest-failure"
        class="scene"
        data-composition-id="04-honest-failure"
        data-composition-src="compositions/frames/04-honest-failure.html"
        data-start="64"
        data-duration="26"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-trust-the-proof", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 16);
        tl.fromTo("#el-02-signed-request", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 16);
        tl.to("#el-02-signed-request", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 40);
        tl.fromTo("#el-03-verification-anchor", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 40);
        tl.to("#el-03-verification-anchor", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 64);
        tl.fromTo("#el-04-honest-failure", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 64);
        tl.to({}, { duration: 90 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
